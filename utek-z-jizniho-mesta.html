// ---------- data (převzato z Java hry) ----------
const I={usb:['USB flashdisk',0x3a7bd5],money:['peníze na kávu'],coffee:['káva'],crowbar:['páčidlo',0xd04030],shoes:['boty (přezutí)'],chip0:['přístupový čip (neaktivní)'],chip1:['přístupový čip (aktivovaný)']};
const R={
B:{n:'Učebna JM357B',d:'Nacházíš se ve startovní místnosti – učebně, ve které jsi při hodině usnul. Lavice jsou prázdné, za okny je tma a v celé budově je ticho.',fc:0x8a7a62,wc:0xc9c2b0,w:10,l:9,g:[3,2],f:[[4,2,.1,0,-4.4,0xeeeeee]],e:[['A','JM357A']]},
A:{n:'Učebna JM357A',d:'Propojená učebna. Na tabuli zůstal nedokončený příklad a u katedry se válí hromada neopravených semestrálních prací.',fc:0x7a6a55,wc:0xbfc7c0,w:10,l:9,g:[2,2],f:[[4,2,.1,0,-4.4,0x234a34],[3,1,1,0,-3,0x6b4a2b],[1,.5,.8,2.5,-3,0xf4f1e8]],i:['mandik'],e:[['B','JM357B'],['U','chodba']]},
U:{n:'Chodba (3. patro)',d:'Stojíš na dlouhé chodbě 3. patra. Svítí tu jen nouzová světla a nic tu neleží.',fc:0x55504a,wc:0x9a7a7a,w:6,l:16,lc:0xff5544,f:[[.2,2.2,1.2,-2.9,-4,0x5a4a3a],[.2,2.2,1.2,2.9,-1,0x5a4a3a],[.2,2.2,1.2,-2.9,2,0x5a4a3a],[.2,2.2,1.2,2.9,5,0x5a4a3a]],e:[['A','JM357A'],['T','WC (3. patro)'],['O','kabinet vyučujícího'],['C','schodiště 2 (dolů do 2. patra)']]},
T:{n:'WC (3. patro)',d:'Vykachlíkované toalety, ve kterých to zvláštně voní po čističi. Někde kape kohoutek a odpočítává vteřiny.',fc:0x9fb5b8,wc:0xd8e6e8,w:8,l:8,f:[[1.4,2.2,.1,-2.5,-3.6,0x88a],[1.4,2.2,.1,0,-3.6,0x88a],[1.4,2.2,.1,2.5,-3.6,0x88a],[3,.9,.6,-2,2.5,0xffffff]],e:[['U','chodba']]},
O:{n:'Kabinet vyučujícího',d:'Vcházíš do kabinetu. Kolem stolu sedí sbor vyučujících a popíjejí kávu.',fc:0x6b5036,wc:0x8c7556,w:9,l:8,f:[[4,.9,2,0,-1,0x4a3020]],x:[[0x333333,-2,-1],[0x553333,2,-1],[0x335533,0,-2.8]],e:[]},

M:{n:'Přednášková místnost JM104',d:'Prostorná přednáškovna se stupňovitými lavicemi. Na plátně svítí nedokončený SQL dotaz.',fc:0x4a4a52,wc:0x9aa0aa,w:11,l:10,f:[[6,3,.1,0,-4.9,0x10161c],[2,1,.8,0,-3.2,0x6b4a2b],[10,.3,1.6,0,0,0x555560],[10,.6,1.6,0,2,0x606068]],i:['chlapek'],e:[['E','chodba 4']]}};
// ---------- stav ----------
let S,conv,over,sc,cam,rr,tA=0;
const has=x=>S.inv.includes(x),fl=x=>S.fl.includes(x),setf=x=>fl(x)||S.fl.push(x);
const del=x=>S.inv.splice(S.inv.indexOf(x),1);
function say(t,c){const p=document.createElement('p');p.textContent=t;if(c)p.className=c;$('l').append(p);$('l').scrollTop=1e9}
function start(){lastLoc=0;S={loc:'B',inv:['shoes'],fl:[],it:{B:['usb'],T:[]}};conv=over=0;$('l').innerHTML='';$('m').style.display='none';
 say('Probudil ses v učebně JM357B. Při hodině jsi na chvilku zavřel oči, jenže z té chvilky se stal šlofík přes zavírací dobu. Škola je prázdná a potmě. Musíš se dostat ven z labyrintu budovy Jižního Města dřív, než dorazí studenti ranních cvičení. Pak už se přes hordy lidí ven nedostaneš. Profesoři ti to ale ulehčovat nebudou...','s');look();build();ui()}
function look(){const r=R[S.loc];say('== '+r.n+' ==\n'+r.d,'s');if(fl('bos'))say('Studená podlaha ti nepříjemně studí bosé nohy.')}
function lose(t){say(t);say('=== KONEC HRY – PROHRA ===','s');end('PROHRA','#f55')}
function win(t){say(t);if(fl('bos'))say('(Bosé nohy tě studí na chodníku, ale svoboda stojí za to.)');say('=== VÝHRA ===','s');end('VÝHRA!','#6f6');night()}
function end(t,c){over=1;conv=0;const m=$('m');m.textContent=t;m.style.color=c;m.style.display='grid'}
function enter(id){
 if(id=='U'&&!fl('mand'))return say('Ing. Mandík ti zablokoval cestu: „Kam si myslíte, že jdete? Nejdřív mi odevzdejte semestrální práci!“');
 if(id=='D'&&!fl('jan'))return say('Školník ti blokuje cestu, chce vidět přezutí.');
 S.loc=id;look();build();
 if(id=='A'&&fl('cs'))lose('Sotva vkročíš do učebny, Ing. Mandík zvedne hlavu od oprav: „Vy jste mi vypil kávu za moje peníze?! To je zpronevěra peněžních prostředků!“ Chytí tě za rukáv a odvede přímo do kabinetu, kde tě sbor vyučujících zadrží až do rána.');
 if(id=='O')lose('„Co tady děláte?!“ obořil se na tebe jeden z profesorů. „Za trest tu s námi hezky zůstanete až do rána!“');
 if(id=='J'&&!fl('jan'))janitor()}
function ask(p,o,f){say(p);conv={o,f}}
function pick(i){const o=conv.o[i];say('» '+o);conv.f(i)}
function janitor(){const P='Na chodbě stojí školník s kyblíkem a svazkem klíčů. Změří si tě přes brýle a zahřmí: „Kolman, kde je přezutí?!“';
 const f=i=>{if(i==0){if(!has('crowbar')){say('Páčidlo u sebe nemáš. Školník se tváří čím dál podezřívavěji, vyber si jinak.');return ask(P,O,f)}
  del('crowbar');setf('jan');setf('stun');conv=0;say('Rázně jsi školníka praštil páčidlem. Skácel se k zemi jako pytel brambor. Páčidlo se ti při úderu zlomilo, ale boty máš pořád na nohou a cesta je volná.');build()}
 else if(i==1){del('shoes');setf('jan');setf('bos');conv=0;say('Potupně sis sundal boty a hodil je školníkovi k nohám. „No vida, a jde to,“ zabručí školník a uvolní ti cestu. Dohraješ bos.');build()}
 else lose('Školník se zamračí, popadne tě za límec a bez dalších řečí tě odnese do kabinetu vyučujícího. Sbor profesorů tě tam za trest zadrží až do rána.')};
 const O=['Vytáhnout páčidlo a školníka omráčit','Pokorně si sundat boty a zahodit je','Předstírat, že školníka neslyšíš, a jít dál'];ask(P,O,f)}
function sql(){const O=['SELECT jmeno WHERE vek > 20 FROM student;','SELECT jmeno FROM student WHERE vek > 20;','SELECT * FROM student ORDER BY vek > 20;'];
 const P='Ing. Chlapek, Ph.D. na tebe přísně pohlédne: „Když už tu jste, pane kolego – jaký je správný SQL dotaz, který vypíše jména všech studentů starších 20 let z tabulky STUDENT?“';
 const f=i=>{if(i==1){S.inv.push('chip0');conv=0;say('„Správně,“ pokývá Chlapek hlavou a podá ti přístupový čip od hlavních dveří. „Aby fungoval, musíte ho nechat aktivovat na studijním oddělení ve 2. patře. A buďte tam slušný.“')}
  else{say(i?'„To vypíše všechny studenty a všechny sloupce. Zkuste to znovu.“':'„To není ani syntakticky správně. Zkuste to znovu.“');ask(P,O,f)}};ask(P,O,f)}
function polite(){let k=0,pts=0;const Q=[
['Jana Hudečková zvedne hlavu od monitoru: „Dobrý večer. Čím mohu posloužit?“',[['Čau, potřebuju aktivovat čip, tak rychle.',1,'Jana ti věnuje dlouhý pohled.'],['Dobrý večer, prosím vás, mohla byste mi aktivovat tenhle čip?',3,'Jana se mírně usměje.'],['Dobrý večer, mám tu čip, aktivujte ho.',2,'Jana zvedne obočí.']]],
['„A proč jste tu tak pozdě? Úřední hodiny už dávno skončily.“',[['To vás nemusí zajímat, mám spěch.',1,'Jana našpulí rty.'],['Zaspal jsem. Stává se.',2,'Jana jen povzdechne.'],['Omlouvám se, usnul jsem na přednášce a snažím se dostat domů.',3,'Jana pokývá hlavou, že chápe.']]],
['„Máte vyplněný formulář o aktivaci?“',[['Formulář nemám, ale rád ho vyplním, pokud mi ho podáte.',3,'Jana ti ochotně podává papír.'],['Jaký formulář? Tohle je zbytečná byrokracie.',1,'Za přepážkou to zavrčí.'],['Formulář nemám, nešlo by to bez něj?',2,'Jana pokrčí rameny.']]],
['„Tak a ještě poslední věc. Co říkáte na naši školu?“',[['Je tu hezká katastrofa.',1,'Hana Judečková si nahlas odfrkne.'],['Je to tu v pohodě, jen těžko se odsud dostává ven.',2,'Jana se pousměje.'],['Škola je skvělá a vy na studijním pracujete obdivuhodně.',3,'Jana se začervená.']]]];
 const show=()=>ask(Q[k][0],Q[k][1].map(o=>o[0]),f);
 const f=i=>{const o=Q[k][1][i];pts+=o[1];say(o[2]);if(++k<4)return show();
  if(pts>=9){del('chip0');S.inv.push('chip1');conv=0;say('Jana Hudečková přiloží čip ke čtečce, ozve se pípnutí. „Hotovo. Čip je aktivovaný, hezký večer.“ Teď už stačí dojít k hlavním dveřím v přízemí.')}
  else lose('Referentky si vyměnily významný pohled. „Takhle se tady s lidmi nemluví. Neslušně vychovaný student nám tu nemá co dělat.“ Než se naděješ, stojíš v kabinetu vyučujícího a sbor profesorů ti oznámí, že tu zůstaneš až do rána.')};show()}
// postavy a věci: n=jméno, p=věc v prostředí, t=rozhovor, a=přijímá předměty, u=použití
const N={
mandik:{n:'Ing. Mandík',t(){say(!fl('mand')?'Ing. Mandík ti zablokoval cestu: „Kam si myslíte, že jdete? Nejdřív mi odevzdejte semestrální práci!“':fl('cm')?'Mandík upíjí kávu: „Výborná. A teď mě nechte, ještě mám co opravovat.“':'Mandík netrpělivě zvedne obočí: „Tak co, kde mám tu kávu? Automat je dole ve 2. patře.“')},a:['usb','coffee'],
 u(x){del(x);if(x=='usb'){S.inv.push('money');setf('mand');say('Odevzdal jsi USB flashdisk Ing. Mandíkovi. „Výborně,“ říká Mandík. „Tady máte peníze, skočte mi do automatu pro kávu.“ Cesta na chodbu je nyní volná. Flashdisk zmizel z inventáře.')}
  else{setf('cm');say('Mandík si kávu vezme a spokojeně ji usrkne: „Děkuji, to jste hodný.“ Žádnou odměnu ti za ni ale nedá. Ten, kdo ví, kde je páčidlo, bude asi někdo jiný...')}}},
student:{n:'spící student',t(){say(fl('cs')?'Student se na chvilku zvedne z gauče: „Páčidlo je na záchodech ve 3. patře. A hlavně nechoď za Mandíkem...“ Pak zase zachrápe.':'Student spí na gauči a něco mumlá. Z jeho blábolení rozeznáš jen slovo „káva“.')},a:['coffee'],
 u(x){del(x);setf('cs');S.it.T.push('crowbar');say('Student se probudí, vděčně vypije kávu a zamumlá: „Na záchodech ve 3. patře najdeš páčidlo. Na školníka jako dělané. Jenom se nevracej k Mandíkovi, kávu měl dostat on...“ A znovu usne. (Do JM357A se už radši nevracej.)')}},
automat:{n:'automat na kávu',p:1,a:['money'],t(){say('Automat bzučí a čeká na mince.')},u(x){del(x);S.inv.push('coffee');say('Vhodil jsi mince do automatu. Automat zabzučel, zachrčel a vyplivl horký kelímek kávy. Peníze zmizely, káva je tvoje.')}},
skolnik:{n:'školník',t(){fl('jan')?say(fl('stun')?'Školník leží na zemi a tiše chrápe. Radši ho nebudit.':'Školník si tvé boty zkoumavě prohlíží: „No vida. Příště přezuj hned.“'):janitor()}},
jana:{n:'Jana Hudečková',t(){has('chip1')?say('Jana Hudečková se usměje: „Čip už máte aktivní, tak ať vám slouží. Hezký večer.“'):!has('chip0')?say('Jana Hudečková: „Bez čipu k aktivaci tu nemáte co dělat. Zkuste to v přednáškové místnosti v přízemí.“'):polite()}},
hana:{n:'Hana Judečková',t(){say('Hana Judečková ani nezvedne oči od papírů: „Nemám čas, neotravujte mě. Obraťte se na kolegyni.“')}},
chlapek:{n:'Ing. Chlapek',t(){has('chip0')||has('chip1')?say('Chlapek na tebe ani nevzhlédne: „Čip už máte. Aktivovat ho půjdete na studijní oddělení do 2. patra.“'):sql()}},
dvere:{n:'hlavní dveře',p:1,a:['chip1','crowbar'],t(){say('Dveře jsou zamčené a čtečka vedle nich nesvítí. Potřebuješ aktivovaný přístupový čip (nebo něco, čím by se dveře daly vypáčit).')},u(x){x=='crowbar'?(del(x),win('Zapřel ses páčidlem do spáry mezi dveřmi a rámem. Zámek zapraskal a dveře povolily. Vyjdeš ven do chladného večera dřív, než dorazili studenti ranních cvičení, a spokojeně míříš domů.')):win('Přiložil jsi aktivovaný čip ke čtečce. Zámek cvakne, dveře se otevřou a ty vyjdeš do chladného večera. Zvládl jsi to dřív, než dorazili studenti ranních cvičení, a spokojeně míříš domů.')}}};
// ---------- UI ----------
function ui(){const b=$('b');b.innerHTML='';const r=R[S.loc];
 $('t').textContent=r.n;$('i').textContent='Inventář: '+(S.inv.length?S.inv.map(x=>I[x][0]).join(', '):'prázdný');
 const row=(h,c)=>{const d=document.createElement('div');d.className='g';d.innerHTML='<i>'+h+'</i>';b.append(d);return(t,f)=>{const e=document.createElement('button');e.textContent=t;e.className=c;e.onclick=()=>{f();ui()};d.append(e)}};
 if(over){row('','x')('Hrát znovu',start);return}
 if(conv){const a=row('Odpověď','w');conv.o.forEach((o,i)=>a((i+1)+') '+o,()=>pick(i)));return}
 let a=row('Jít','');r.e.forEach(([id,l])=>a(l,()=>enter(id)));
 const its=S.it[S.loc]||[];if(its.length){a=row('Sebrat','n');its.forEach(x=>a(I[x][0],()=>{its.splice(its.indexOf(x),1);S.inv.push(x);say('Sebral jsi: '+I[x][0]+'.');build()}))}
 const io=r.i||[];const tk=io.filter(k=>!N[k].p);if(tk.length){a=row('Mluvit','w');tk.forEach(k=>a(N[k].n,N[k].t))}
 const us=[];S.inv.forEach(x=>io.forEach(k=>N[k].a&&N[k].a.includes(x)&&us.push([x,k])));
 if(us.length){a=row('Použít','x');us.forEach(([x,k])=>a(I[x][0]+' → '+N[k].n,()=>{N[k].u(x);build()}))}
 if(io.includes('dvere')){a=row('Dveře','x');a('Zkusit odejít z budovy',()=>has('chip1')?win('Přiložil jsi aktivovaný čip ke čtečce. Zámek cvakne, dveře se otevřou a ty vyjdeš do chladného večera. Zvládl jsi to dřív, než dorazili studenti ranních cvičení, a spokojeně míříš domů.'):say('Dveře jsou zamčené a čtečka vedle nich nesvítí. Potřebuješ aktivovaný přístupový čip (nebo něco, čím by se dveře daly vypáčit).'))}
 a=row('Hra','');a('Uložit',()=>{try{localStorage.jm=JSON.stringify(S);say('Hra uložena.')}catch(e){say('Uložení se nepodařilo.')}});
 a('Načíst',()=>{try{S=JSON.parse(localStorage.jm);say('Hra načtena.');look();build()}catch(e){say('Nic uloženo.')}})}
// ---------- 3D ----------
